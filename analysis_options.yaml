include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Money and quantity arithmetic is written with explicit types on purpose —
    # a `var` that quietly becomes a double is exactly the class of bug this
    # rewrite exists to remove.
    always_specify_types: ignore
    prefer_const_constructors: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - unawaited_futures
